<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhishGuard | Login</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="login">
  <div class="auth-wrapper">
    <div class="panel auth-card">
      <div class="brand">
        <div class="logo">PG</div>
        <div>
          <div class="brand-title">PhishGuard</div>
          <div class="brand-subtitle">Sign in to continue</div>
        </div>
      </div>
      <h1>Login</h1>
      <div class="alert" id="loginAlert">Demo account: demo@phishguard.com / password123</div>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />

        <label>Password</label>
        <input id="password" type="password" placeholder="Enter your password" required />

        <button type="submit" class="btn primary">Login</button>
      </form>
      <p class="help-text">No account yet? <a href="register.html">Create one</a>. This login is local only for Phase 1.</p>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
