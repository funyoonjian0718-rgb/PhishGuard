<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhishGuard | Register</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="register">
  <div class="auth-wrapper">
    <div class="panel auth-card">
      <div class="brand">
        <div class="logo">PG</div>
        <div>
          <div class="brand-title">PhishGuard</div>
          <div class="brand-subtitle">Create local demo account</div>
        </div>
      </div>
      <h1>Register</h1>
      <div class="alert" id="registerAlert">This is Phase 1 local storage only. Real authentication will be added later.</div>
      <form id="registerForm">
        <label>Full Name</label>
        <input id="fullName" type="text" placeholder="Enter your full name" required />

        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />

        <label>Password</label>
        <input id="password" type="password" placeholder="Minimum 8 characters" required />

        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" placeholder="Confirm password" required />

        <button type="submit" class="btn primary">Create Account</button>
      </form>
      <p class="help-text">Already have an account? <a href="login.html">Login</a>.</p>
    </div>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
